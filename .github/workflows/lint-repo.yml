name: Lint Repo

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # reviewdog's github-pr-check reporter needs to publish check runs; every
    # other scope stays read-only. See .github/workflow-policy.json.
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |=======|>>>>>>> )' -- ":(exclude).github/workflows/lint-repo.yml" ":(exclude).husky/pre-commit" ":(exclude)scripts/check-conflict-markers.sh"; then
            echo "❌ Conflict markers found in the repository!"
            exit 1
          fi

      - name: Ensure no npm or yarn lockfiles
        run: |
          found=$(find . -name "package-lock.json" -o -name "yarn.lock" | grep -v "node_modules/")
          if [ -n "$found" ]; then
            echo "❌ ERROR: Found npm/yarn lockfiles. Use pnpm only."
            echo "$found"
            exit 1
          fi

      - name: Run actionlint
        uses: reviewdog/action-actionlint@6c5efc3e507f3a0678fe69e82423dfe41edc86b8 # v1.44.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          filter_mode: nofilter
          fail_on_error: true

      # Issue #289: detect privilege or pinning regressions before merge.
      # Both the policy audit and its focused unit tests are dependency-free.
      - name: Audit workflow permissions and action pins
        run: python3 tools/workflow_guard.py

      - name: Test workflow guard
        run: python3 -m unittest discover -s tools/tests -p 'test_workflow_guard.py' -v
