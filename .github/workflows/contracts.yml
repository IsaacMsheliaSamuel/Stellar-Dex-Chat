name: Smart Contract CI

# ── Caching strategy (issue #285) ────────────────────────────────────────────
#
# Every Rust job uses Swatinem/rust-cache with an explicit shared-key that
# encodes both the Cargo.lock hash and the pinned toolchain string.  This
# means:
#
#   • A Cargo.lock change invalidates every Rust cache entry simultaneously,
#     so no job ever runs with a stale dependency tree.
#   • A toolchain pin change likewise invalidates all entries, preventing a
#     new Rust release from being silently served from an old cache.
#   • The shared-key is the same across all jobs in this file, so the cache
#     populated by the first job that finishes is reused by the others.
#
# Secrets are never written into the cache key or into cached paths.
# The readiness-gate and deploy jobs authenticate at runtime only.
#
# Cache hit/miss is surfaced via the `cache-hit` output of the cache step and
# echoed to the step summary so it is visible in the Actions UI without
# having to open individual job logs.

on:
  pull_request:
    branches: [main]
    paths:
      - "Dechat/stellar-contracts/**"
      - "Dechat/dex_with_fiat_frontend/src/lib/contracts/**"
      - ".github/workflows/contracts.yml"
      - ".github/workflows/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "Dechat/dex_with_fiat_frontend/pnpm-lock.yaml"
      - "Dechat/dex_with_fiat_frontend/package.json"
      - ".github/dependabot.yml"
      - ".github/CODEOWNERS"
      - "SECURITY.md"
  push:
    branches: [main]
    paths:
      - "Dechat/stellar-contracts/**"
      - "Dechat/dex_with_fiat_frontend/src/lib/contracts/**"
      - ".github/workflows/contracts.yml"
      - ".github/workflows/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "Dechat/dex_with_fiat_frontend/pnpm-lock.yaml"
      - "Dechat/dex_with_fiat_frontend/package.json"
      - ".github/dependabot.yml"
      - ".github/CODEOWNERS"
      - "SECURITY.md"

# Least privilege by default: workflows only need to read repository contents.
# Any job requiring write access must declare it explicitly at the job level.
permissions:
  contents: read

env:
  MAX_WASM_BYTES: "98500"
  # Pinned toolchain versions. These MUST match the canonical manifest at
  # Dechat/stellar-contracts/toolchain-versions.env and rust-toolchain.toml.
  # The verify-toolchain job fails with a clear mismatch message if they drift.
  RUST_TOOLCHAIN: "1.84.0"
  RUST_TARGET: "wasm32v1-none"
  STELLAR_CLI_VERSION: "28.0.0"
  SOROBAN_SDK_VERSION: "22.0.0"
  RUSTFMT_VERSION: "1.84.0"
  CLIPPY_VERSION: "1.84.0"
  BINDINGS_DIR: "Dechat/dex_with_fiat_frontend/src/lib/contracts"
  # Machine-readable deployment manifest (issue #189). The manifest records
  # network, Wasm hash, contract ID, spec version and required admin/oracle
  # configuration. It is validated against the built artifact and the target
  # network before any deploy step is allowed to proceed.
  DEPLOYMENT_MANIFEST: "Dechat/stellar-contracts/deployment-manifest.json"
  # Expected chain identity for canary verification. Override per-environment
  # via repository/environment variables; defaults to Stellar testnet.
  EXPECTED_NETWORK_PASSPHRASE: ${{ vars.EXPECTED_NETWORK_PASSPHRASE || 'Test SDF Network ; September 2015' }}
  EXPECTED_RPC_URL: ${{ vars.EXPECTED_RPC_URL || 'https://soroban-testnet.stellar.org' }}

jobs:
  verify-toolchain:
    name: Verify pinned toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify pinned versions match canonical manifest
        run: |
          set -euo pipefail
          MANIFEST=Dechat/stellar-contracts/toolchain-versions.env
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Canonical toolchain manifest $MANIFEST is missing"
            exit 1
          fi
          # shellcheck disable=SC1090
          source "$MANIFEST"
          fail=0
          check() {
            local name="$1" expected="$2" actual="$3"
            if [ "$expected" != "$actual" ]; then
              echo "::error::Toolchain mismatch for $name: workflow pins '$actual' but manifest pins '$expected'"
              fail=1
            else
              echo "OK: $name = $expected"
            fi
          }
          check RUST_TOOLCHAIN "$RUST_TOOLCHAIN" "${{ env.RUST_TOOLCHAIN }}"
          check RUST_TARGET "$RUST_TARGET" "${{ env.RUST_TARGET }}"
          check STELLAR_CLI_VERSION "$STELLAR_CLI_VERSION" "${{ env.STELLAR_CLI_VERSION }}"
          check SOROBAN_SDK_VERSION "$SOROBAN_SDK_VERSION" "${{ env.SOROBAN_SDK_VERSION }}"
          check RUSTFMT_VERSION "$RUSTFMT_VERSION" "${{ env.RUSTFMT_VERSION }}"
          check CLIPPY_VERSION "$CLIPPY_VERSION" "${{ env.CLIPPY_VERSION }}"
          if [ "$fail" -ne 0 ]; then
            echo "::error::Workflow toolchain pins drifted from $MANIFEST. Update both to the same versions."
            exit 1
          fi

  verify-deployment-manifest:
    name: Verify deployment manifest
    runs-on: ubuntu-latest
    needs: [verify-toolchain]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate manifest schema and network identity
        run: |
          set -euo pipefail
          MANIFEST="${{ env.DEPLOYMENT_MANIFEST }}"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Deployment manifest $MANIFEST is missing"
            exit 1
          fi
          node - "$MANIFEST" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const expectedPassphrase = process.env.EXPECTED_NETWORK_PASSPHRASE;
          const expectedRpc = process.env.EXPECTED_RPC_URL;
          const required = ['network', 'networkPassphrase', 'rpcUrl', 'wasmHash', 'contractId', 'specVersion', 'admin', 'oracle'];
          let manifest;
          try {
            manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          } catch (err) {
            console.error(`::error::Deployment manifest is not valid JSON: ${err.message}`);
            process.exit(1);
          }
          const errors = [];
          for (const key of required) {
            if (manifest[key] === undefined || manifest[key] === null || manifest[key] === '') {
              errors.push(`missing required field '${key}'`);
            }
          }
          if (typeof manifest.wasmHash === 'string' && !/^[0-9a-f]{64}$/.test(manifest.wasmHash)) {
            errors.push(`wasmHash must be a 64-char lowercase hex string, got '${manifest.wasmHash}'`);
          }
          if (typeof manifest.contractId === 'string' && !/^C[A-Z2-7]{55}$/.test(manifest.contractId)) {
            errors.push(`contractId must be a valid Stellar contract address (C...), got '${manifest.contractId}'`);
          }
          if (typeof manifest.specVersion !== 'string' || !/^\d+\.\d+\.\d+$/.test(manifest.specVersion)) {
            errors.push(`specVersion must be semver (x.y.z), got '${manifest.specVersion}'`);
          }
          if (manifest.admin && typeof manifest.admin !== 'string') {
            errors.push('admin must be a string address');
          }
          if (manifest.oracle && typeof manifest.oracle !== 'string') {
            errors.push('oracle must be a string address');
          }
          // Reject accidental cross-network configuration: the manifest must
          // describe the same network the workflow is targeting.
          if (expectedPassphrase && manifest.networkPassphrase !== expectedPassphrase) {
            errors.push(`networkPassphrase mismatch: manifest '${manifest.networkPassphrase}' != target '${expectedPassphrase}'`);
          }
          if (expectedRpc && manifest.rpcUrl !== expectedRpc) {
            errors.push(`rpcUrl mismatch: manifest '${manifest.rpcUrl}' != target '${expectedRpc}'`);
          }
          if (errors.length > 0) {
            for (const e of errors) console.error(`::error::${e}`);
            process.exit(1);
          }
          console.log(`OK: deployment manifest valid for network '${manifest.network}'`);
          NODE
        env:
          EXPECTED_NETWORK_PASSPHRASE: ${{ env.EXPECTED_NETWORK_PASSPHRASE }}
          EXPECTED_RPC_URL: ${{ env.EXPECTED_RPC_URL }}

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    needs: [verify-toolchain]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Dechat/stellar-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      # Cache key encodes lockfile hash + toolchain so either change busts the
      # cache.  The shared-key is identical across all jobs so whichever job
      # populates the cache first benefits all subsequent jobs in the run.
      - name: Cache Cargo dependencies
        id: cargo-cache
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: Dechat/stellar-contracts -> target
          shared-key: "contracts-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Dechat/stellar-contracts/Cargo.lock') }}"

      - name: Report cache status
        run: |
          if [ "${{ steps.cargo-cache.outputs.cache-hit }}" = "true" ]; then
            echo "cargo-cache: HIT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cargo-cache: MISS (new entry will be saved)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest
    needs: [verify-toolchain]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Dechat/stellar-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache Cargo dependencies
        id: cargo-cache
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: Dechat/stellar-contracts -> target
          shared-key: "contracts-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Dechat/stellar-contracts/Cargo.lock') }}"

      - name: Report cache status
        run: |
          if [ "${{ steps.cargo-cache.outputs.cache-hit }}" = "true" ]; then
            echo "cargo-cache: HIT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cargo-cache: MISS (new entry will be saved)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [verify-toolchain]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Dechat/stellar-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check Cargo.lock is not drifting alone
        i