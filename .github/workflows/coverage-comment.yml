name: Frontend Coverage Comment

# Runs in the base repo's context (not the PR head's), so it gets a
# write-capable GITHUB_TOKEN even for PRs from forks. It never checks out
# or executes any code from the PR — it only downloads the small JSON
# artifact produced by the `build` job in frontend.yml and posts/updates a
# PR comment from it.
on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    name: Post coverage comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    # Only the comment step needs write access to pull requests.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download coverage report artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download critical coverage report artifact
        id: download-critical
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: critical-coverage-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('coverage-report.json', 'utf8'));
            const marker = '<!-- frontend-coverage-report -->';
            const total = report.total ?? {};
            const targets = report.targets ?? {
              statements: 70,
              branches: 65,
              functions: 70,
              lines: 70,
            };

            const row = (label, pct, target) => {
              const value = Number(pct ?? 0);
              const status = value >= target ? '✅' : '⚠️';
              return `| ${label} | ${value.toFixed(2)}% | ${target}% | ${status} |`;
            };

            const headSha = report.head_sha ?? context.payload.workflow_run?.head_sha ?? '';
            const body = [
              marker,
              '### Frontend unit test coverage',
              '',
              headSha ? `Commit \`${headSha.slice(0, 7)}\`` : '',
              '',
              '| Metric | Coverage | Target | |',
              '|---|---|---|---|',
              row('Statements', total.statements?.pct, targets.statements),
              row('Branches', total.branches?.pct, targets.branches),
              row('Functions', total.functions?.pct, targets.functions),
              row('Lines', total.lines?.pct, targets.lines),
              '',
              '_Critical financial module thresholds below are enforced as a CI gate._',
            ];

            if (fs.existsSync('critical-coverage-report.json')) {
              const critical = JSON.parse(fs.readFileSync('critical-coverage-report.json', 'utf8'));
              const criticalTargets = critical.targets ?? targets;
              body.push(
                '',
                '### Critical financial module coverage',
                '',
                '| Metric | Coverage | Target | |',
                '|---|---|---|---|',
                row('Statements', critical.critical?.statements?.pct, criticalTargets.statements),
                row('Branches', critical.critical?.branches?.pct, criticalTargets.branches),
                row('Functions', critical.critical?.functions?.pct, criticalTargets.functions),
                row('Lines', critical.critical?.lines?.pct, criticalTargets.lines),
                '',
                `Mutation score: **${critical.mutation?.score ?? 0}%** (target ${critical.mutationTarget ?? 100}%)`,
                `Uncovered changed critical lines: **${critical.changedLines?.uncoveredChangedLines ?? 0}**`,
              );
            }

            const comment = body.join('\n');

            const { owner, repo } = context.repo;
            const issue_number = report.pr_number;

            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: comment });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: comment });
            }
